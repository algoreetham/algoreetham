    :root {
      --bg: #0d1117;
      --card-bg: #f3f3f1;
      --ink: #111111;
      --blue: #3a56f5;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: #e6edf3;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px 16px;
    }

    /* Top Navigation */
    .nav-bar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      margin-bottom: 24px;
      border-radius: 16px;
      background: rgba(22, 27, 34, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      position: sticky;
      top: 16px;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #f0f6fc;
      text-decoration: none;
    }

    .nav-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #3fb950;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 8px #3fb950;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }

    .nav-links {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      text-decoration: none;
      color: #c9d1d9;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue);
      transform: translateY(-1px);
    }

    /* Portfolio Layout */
    .portfolio-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid-3, .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    /* Card Wrapper & Scroll Animation */
    .card {
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(45px);
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .card.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    /* Hover effect on interactive cards */
    a.card-link {
      display: block;
      text-decoration: none;
      border-radius: 28px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    a.card-link:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 18px 40px rgba(58, 86, 245, 0.25);
    }

    /* Footer */
    footer {
      margin-top: 60px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #8b949e;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

  <!-- Scroll-Triggered Animation Controller -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cards = document.querySelectorAll(".card");

      // Intersection Observer with precise scroll threshold
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            // Add in-view class to trigger the card entrance and internal SVG animations
            entry.target.classList.add("in-view");
          }
        });
      }, {
        threshold: 0.15,
        rootMargin: "0px 0px -40px 0px"
      });

      cards.forEach((card) => observer.observe(card));
    });
  </script>
