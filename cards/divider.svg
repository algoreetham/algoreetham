<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="28" viewBox="0 0 1000 28" role="img" aria-label="Divider"><title>Divider</title><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7e7e3"/><stop offset="1" stop-color="#f3f3f1"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a56f5" stop-opacity="0"/><stop offset=".5" stop-color="#3a56f5"/><stop offset="1" stop-color="#3a56f5" stop-opacity="0"/></linearGradient><style>.serif{font-family:'Instrument Serif',serif}.serifi{font-family:'Instrument Serif',serif;font-style:italic}.mono{font-family:'JetBrains Mono',monospace}.sans{font-family:Inter,sans-serif}.sansm{font-family:Inter,sans-serif;font-weight:500}
@keyframes rise{0%{opacity:0;transform:translateY(16px)}5%,100%{opacity:1;transform:none}}
