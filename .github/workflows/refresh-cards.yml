name: Refresh profile cards

on:
  schedule:
    - cron: "30 0 * * *"   # every day, 6:00 AM India time
  workflow_dispatch:        # lets you press "Run workflow" yourself
  push:
    paths: ["scripts/**", "data/hackathons.json", "data/portrait.txt", ".github/workflows/refresh-cards.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Save contribution data
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Draw the cards
        run: python scripts/render_readme_cards.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/contributions.json
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git push)
